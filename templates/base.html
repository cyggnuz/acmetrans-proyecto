{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ACME TRANS{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/general.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="fondo-admin">

<div class="layout-admin">

  <!-- SIDEBAR -->
  <aside class="sidebar-admin">
    <div class="logo-sidebar">
      <img src="{% static 'css/img/logo-icon2.png' %}" alt="ACME TRANS">
      <h2>ACME TRANS</h2>
    </div>

    <nav class="menu-sucursales">
      <h3>Sucursales</h3>
      <ul>
        <li><a href="?sucursal=Santiago"><span class="dot santiago"></span> Santiago</a></li>
        <li><a href="?sucursal=Coquimbo"><span class="dot coquimbo"></span> Coquimbo</a></li>
        <li><a href="?sucursal=Osorno"><span class="dot osorno"></span> Osorno</a></li>
      </ul>
    </nav>

    <div class="logout-section">
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn-logout">Cerrar Sesión</button>
      </form>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <section class="panel-content">

    <!-- TOPBAR -->
    <nav class="topbar">
      <ul>
        <li><a href="{% url 'panel_admin' %}" class="{% if active == 'boards' %}activo{% endif %}">Boards</a></li>
        <li><a href="{% url 'inbox' %}" class="{% if active == 'inbox' %}activo{% endif %}">Inbox</a></li>
        <li><a href="{% url 'solicitudes' %}" class="{% if active == 'solicitudes' %}activo{% endif %}">Solicitudes</a></li>
        <li><a href="{% url 'reportes' %}" class="{% if active == 'reportes' %}activo{% endif %}">Reportes</a></li>
        <li><a href="{% url 'historial' %}" class="{% if active == 'historial' %}activo{% endif %}">Historial</a></li>
      </ul>
    </nav>

    <!-- CONTENIDO VARIABLE -->
    <main>
      {% block content %}
      {% endblock %}
    </main>

  </section>
</div>

</body>
</html>
