{% extends "base.html" %}
{% block title %}Inbox | ACME TRANS{% endblock %}

{% block content %}
<header class="admin-header">
  <h1>📨 Bandeja de Notificaciones</h1>
</header>

<div class="bandeja-notificaciones">
  {% for n in notificaciones %}
  <div class="noti-card">
    <h3>{{ n.titulo }}</h3>
    <p class="detalle">{{ n.detalle }}</p>
    <span class="hora">{{ n.hora }}</span>
  </div>
  {% endfor %}
</div>
{% endblock %}
